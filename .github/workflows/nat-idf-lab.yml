name: ESP-IDF NAT isolated lab
on:
  push:
    branches: [v6.1-ultimate-pro]
    paths:
      - 'nat_idf/**'
      - '.github/workflows/nat-idf-lab.yml'
  workflow_dispatch:
jobs:
  nat-link:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: ESP-IDF NAT link test (no flash)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: nat_idf
          command: idf.py build
