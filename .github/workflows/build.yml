name: Build ESP32-S3 Toolbox

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Install esptool
        run: pip install esptool

      - name: Create merged firmware
        run: |
          python -m esptool --chip esp32s3 merge-bin \
            -o .pio/build/esp32-s3-n16r8/esp32-s3-toolbox-v1-merged.bin \
            --flash-mode dio \
            --flash-freq 40m \
            --flash-size 16MB \
            0x0000 .pio/build/esp32-s3-n16r8/bootloader.bin \
            0x8000 .pio/build/esp32-s3-n16r8/partitions.bin \
            0x10000 .pio/build/esp32-s3-n16r8/firmware.bin

      - name: Show build files
        run: ls -lh .pio/build/esp32-s3-n16r8/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-toolbox-v1
          path: |
            .pio/build/esp32-s3-n16r8/bootloader.bin
            .pio/build/esp32-s3-n16r8/partitions.bin
            .pio/build/esp32-s3-n16r8/firmware.bin
            .pio/build/esp32-s3-n16r8/esp32-s3-toolbox-v1-merged.bin
          if-no-files-found: error
