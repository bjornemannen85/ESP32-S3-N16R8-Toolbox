name: Build ES3C28P Touch
on:
  push:
    branches: [v4.6-touch]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio esptool
      - run: pio run
      - name: Prepare flash images
        run: |
          mkdir -p dist
          cp .pio/build/es3c28p/firmware.bin dist/
          cp .pio/build/es3c28p/bootloader.bin dist/
          cp .pio/build/es3c28p/partitions.bin dist/
          python -m esptool --chip esp32s3 merge_bin -o dist/es3c28p-v4.6-merged.bin --flash_mode dio --flash_freq 40m --flash_size 16MB 0x0 dist/bootloader.bin 0x8000 dist/partitions.bin 0x10000 dist/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: es3c28p-v4.6-touch
          path: dist/*.bin
