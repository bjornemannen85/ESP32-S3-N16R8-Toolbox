name: Build ESP32-S3 Toolbox

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Show build files
        run: ls -lh .pio/build/esp32-s3-n16r8/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-n16r8-firmware
          path: |
            .pio/build/esp32-s3-n16r8/bootloader.bin
            .pio/build/esp32-s3-n16r8/partitions.bin
            .pio/build/esp32-s3-n16r8/firmware.bin
          if-no-files-found: error
