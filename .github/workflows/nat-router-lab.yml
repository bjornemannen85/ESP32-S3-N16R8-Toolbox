name: ESP-IDF NAT AP STA prototype

on:
  push:
    branches: [v6.1-ultimate-pro]
    paths:
      - 'nat_router_idf/**'
      - '.github/workflows/nat-router-lab.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Compile isolated NAT router prototype
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: nat_router_idf
          command: idf.py build
