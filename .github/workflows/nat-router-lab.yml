name: ESP-IDF NAT AP STA prototype
on:
  push:
    branches: [v6.1-ultimate-pro]
    paths:
      - 'nat_router_idf/**'
      - '.github/workflows/nat-router-lab.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Compile isolated NAT router prototype
        uses: docker://espressif/idf:v5.3.2
        with:
          entrypoint: /bin/bash
          args: -c 'cd nat_router_idf && idf.py build'
