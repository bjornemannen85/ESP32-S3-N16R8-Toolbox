name: Cyberdeck V6.2 Full Access NAT
on:
  push:
    branches: [v6.2-full-access]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v62-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/v62-dom jsdom@30.1.3
      - run: V62_JSDOM=/tmp/v62-dom/node_modules/jsdom node tests/web_test.cjs
      - run: python -m pip install Pillow==12.3.0
      - run: python ci/catalog.py --check
      - run: python -m unittest discover -s tests -v
      - run: g++ -std=c++17 -Wall -Wextra -Werror -Itests/stubs -Isrc tests/server_test.cpp -o /tmp/server-test && /tmp/server-test
      - run: g++ -std=c++17 -Wall -Wextra -Werror -Itests/stubs -Isrc tests/wolfdeck_test.cpp -o /tmp/wolfdeck-test && /tmp/wolfdeck-test
  firmware:
    needs: regression
    if: github.ref == 'refs/heads/v6.2-full-access'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build complete Cyberdeck with real lwIP NAPT
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: idf_arduino_nat_probe
          command: idf.py build && bash ci/package_v62.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cyberdeck-v6.2-full-access-nat-firmware
          path: idf_arduino_nat_probe/build/v62-dist/*
          if-no-files-found: error
          retention-days: 90
