name: V6.1 Arduino ESP-IDF NAT compatibility probe

on:
  push:
    branches: [v6.1-ultimate-pro]
    paths:
      - 'idf_arduino_nat_probe/**'
      - '.github/workflows/arduino-idf-nat-probe.yml'
  workflow_dispatch:

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build and diagnose Arduino SSL linking
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: idf_arduino_nat_probe
          command: |
            bash -c '
              set +e
              idf.py build
              result=$?

              echo "=== SSL SYMBOL DIAGNOSTICS ==="

              LIB="build/esp-idf/espressif__arduino-esp32/libespressif__arduino-esp32.a"

              if [ -f "$LIB" ]; then
                xtensa-esp32s3-elf-nm -C "$LIB" | grep -E "ssl_init|start_ssl_client|stop_ssl_socket|send_ssl_data|send_net_data" | head -60 || true
              else
                echo "Arduino library not found: $LIB"
              fi

              echo "=== BUILD EXIT CODE: $result ==="
              exit "$result"
            '
