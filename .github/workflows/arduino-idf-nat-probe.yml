name: V6.1 Arduino ESP-IDF NAT compatibility probe

on:
  push:
    branches: [v6.1-ultimate-pro]
    paths:
      - 'idf_arduino_nat_probe/**'
      - '.github/workflows/arduino-idf-nat-probe.yml'
  workflow_dispatch:

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build and diagnose Arduino SSL linking
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: idf_arduino_nat_probe
          command: bash ci/diagnose.sh && bash ci/package.sh

      - name: Upload ESP32-S3 NAT merged firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cyberdeck-v6.1-nat-firmware
          path: idf_arduino_nat_probe/build/esp32-s3-v6.1-nat-merged.bin
          if-no-files-found: error
          retention-days: 30
